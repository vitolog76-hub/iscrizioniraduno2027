<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>Check-in Raduno Aquile Alfee</title>
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --red: #c8102e;
      --ink: #0a0a0a;
      --ink-2: #404040;
      --ink-3: #737373;
      --paper: #f8f6f2;
      --line: #e5e5e5;
      
      --success: #16a34a;
      --success-bg: #f0fdf4;
      --info: #2563eb;
      --info-bg: #eff6ff;
      --warning: #d97706;
      --warning-bg: #fffbeb;
      --error: #dc2626;
      --error-bg: #fef2f2;
      --neutral: #4b5563;
      --neutral-bg: #f3f4f6;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      background: var(--paper);
      font-family: 'Barlow', sans-serif;
      color: var(--ink);
      -webkit-font-smoothing: antialiased;
      margin: 0;
      padding: 0;
      -webkit-user-select: none; user-select: none;
    }
    h1, h2, h3, .condensed { font-family: 'Barlow Condensed', sans-serif; letter-spacing: 0.01em; }

    .app-header {
      background: #ffffff;
      border-top: 6px solid var(--red);
      border-bottom: 1px solid var(--line);
      padding: 1.5rem 1.25rem;
      text-align: center;
    }
    .app-header h1 {
      font-size: 1.875rem;
      font-weight: 700;
      text-transform: uppercase;
      margin: 0;
      line-height: 1;
    }
    .app-header p {
      font-size: 0.75rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--ink-3);
      margin: 0.5rem 0 0 0;
      font-weight: 500;
    }

    .app-container { max-width: 32rem; margin: 0 auto; padding: 1.25rem; }

    .scanner-box {
      background: #ffffff;
      border: 1px solid var(--line);
      padding: 0.75rem;
      margin-bottom: 1.25rem;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
    }
    #reader { width: 100%; }
    #reader video { border-radius: 2px; }

    .manual-box {
      background: #ffffff;
      border: 1px solid var(--line);
      padding: 1.25rem;
      margin-bottom: 1.25rem;
    }
    .manual-label {
      font-size: 0.6875rem;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--ink-2);
      display: block;
      margin-bottom: 0.75rem;
    }
    .manual-input-group { display: flex; gap: 0.5rem; }
    .manual-input {
      flex: 1;
      background: #ffffff;
      border: 1px solid var(--line);
      padding: 0.875rem 1rem;
      font-size: 1rem;
      color: var(--ink);
      font-family: 'Barlow', sans-serif;
      text-transform: uppercase;
      border-radius: 0;
    }
    .manual-input:focus {
      outline: none;
      border-color: var(--red);
      box-shadow: 0 0 0 3px rgba(200, 16, 46, 0.08);
    }
    .btn-search {
      background: var(--ink);
      color: #ffffff;
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 1rem;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      padding: 0 1.5rem;
      border: none;
      cursor: pointer;
      transition: background 0.15s;
    }
    .btn-search:hover { background: var(--red); }

    .result-box {
      background: #ffffff;
      border: 1px solid var(--line);
      margin-bottom: 1.25rem;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
      overflow: hidden;
    }
    .result-header {
      padding: 2rem 1.5rem;
      text-align: center;
      border-bottom: 1px solid var(--line);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    .result-icon { margin-bottom: 1rem; }
    .result-title {
      font-size: 2.5rem;
      font-weight: 800;
      text-transform: uppercase;
      margin: 0;
      line-height: 1;
      letter-spacing: 0.02em;
    }
    .result-name {
      font-size: 1.25rem;
      font-weight: 600;
      color: var(--ink-2);
      margin: 0.75rem 0 0 0;
    }
    .result-total {
      font-size: 1rem;
      font-weight: 500;
      color: var(--ink-3);
      margin: 0.25rem 0 0 0;
    }
    
    .status-ok .result-header { border-left: 6px solid var(--success); background: var(--success-bg); }
    .status-ok .result-title { color: var(--success); }
    .status-ok .result-icon { color: var(--success); }
    
    .status-info .result-header { border-left: 6px solid var(--info); background: var(--info-bg); }
    .status-info .result-title { color: var(--info); }
    .status-info .result-icon { color: var(--info); }
    
    .status-warning .result-header { border-left: 6px solid var(--warning); background: var(--warning-bg); }
    .status-warning .result-title { color: var(--warning); }
    
    .status-error .result-header { border-left: 6px solid var(--error); background: var(--error-bg); }
    .status-error .result-title { color: var(--error); }

    .status-neutral .result-header { border-left: 6px solid var(--neutral); background: var(--neutral-bg); }
    .status-neutral .result-title { color: var(--neutral); }

    .result-details { padding: 1.5rem; }
    .person-block {
      margin-bottom: 1.5rem;
      border-bottom: 1px solid var(--line);
      padding-bottom: 1.5rem;
    }
    .person-block:last-child { margin-bottom: 0; border-bottom: none; padding-bottom: 0; }
    .person-title {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 1.125rem;
      font-weight: 700;
      text-transform: uppercase;
      color: var(--ink);
      margin: 0 0 0.75rem 0;
      border-bottom: 2px solid var(--line);
      padding-bottom: 0.5rem;
      display: inline-block;
    }
    .detail-row { display: flex; justify-content: space-between; font-size: 0.9375rem; padding: 0.25rem 0; gap: 1rem; }
    .detail-label { color: var(--ink-3); font-weight: 500; }
    .detail-value { color: var(--ink); font-weight: 600; text-align: right; }
    
    .meal-list { list-style: none; padding: 0; margin: 0.5rem 0 0 0; }
    .meal-list li { 
      font-size: 0.9375rem; 
      padding: 0.25rem 0; 
      color: var(--ink);
      display: flex;
      align-items: center;
    }
    .meal-list li::before {
      content: '';
      display: inline-block;
      width: 4px; height: 4px;
      background: var(--red);
      margin-right: 0.5rem;
      border-radius: 50%;
    }
    
    .dietary-box {
      margin-top: 0.75rem;
      background: #fffbeb;
      border: 1px solid #fcd34d;
      border-left: 3px solid var(--warning);
      padding: 0.75rem;
      font-size: 0.875rem;
      color: #92400e;
    }
    .dietary-box strong { display: block; text-transform: uppercase; font-size: 0.6875rem; letter-spacing: 0.05em; margin-bottom: 0.25rem; }

    .info-timestamp {
      display: inline-block;
      margin-top: 1rem;
      padding: 0.5rem 1rem;
      background: #ffffff;
      border: 1px solid #bfdbfe;
      border-radius: 999px;
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 0.9375rem;
      font-weight: 700;
      color: var(--info);
      letter-spacing: 0.03em;
    }
    .info-timestamp.success { border-color: #bbf7d0; color: var(--success); }

    .order-info-block {
      background: #fafafa;
      border: 1px solid var(--line);
      padding: 1rem;
      margin-bottom: 1.5rem;
    }
    .order-info-title {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 0.875rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--ink-3);
      margin: 0 0 0.5rem 0;
    }

    .result-actions {
      padding: 1.5rem;
      background: #faf9f7;
      border-top: 1px solid var(--line);
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }
    .btn-action {
      width: 100%;
      padding: 1rem;
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 1.125rem;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      text-align: center;
      border: none;
      cursor: pointer;
      transition: all 0.15s;
      border-radius: 0;
    }
    .btn-confirm { background: var(--success); color: #ffffff; }
    .btn-confirm:hover { background: #15803d; }
    
    .btn-cancel { background: transparent; color: var(--ink); border: 1px solid var(--ink); }
    .btn-cancel:hover { background: var(--ink); color: #ffffff; }
    
    .btn-next { background: var(--ink); color: #ffffff; }
    .btn-next:hover { background: var(--neutral); }

    .search-results-title {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 1.5rem;
      font-weight: 700;
      text-transform: uppercase;
      margin: 0 0 1rem 0;
      color: var(--ink);
    }
    .search-item {
      width: 100%;
      text-align: left;
      background: #ffffff;
      border: 1px solid var(--line);
      padding: 1rem;
      margin-bottom: 0.5rem;
      cursor: pointer;
      transition: all 0.15s;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-radius: 0;
    }
    .search-item:hover { border-color: var(--red); background: #fafafa; }
    .search-item-name { font-weight: 700; font-size: 1rem; color: var(--ink); }
    .search-item-status { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.05em; font-weight: 600; margin-top: 0.25rem; }
    .search-item-status.paid { color: var(--success); }
    .search-item-status.not-paid { color: var(--error); }
    .search-item-price { font-family: 'Barlow Condensed', sans-serif; font-size: 1.25rem; font-weight: 700; color: var(--ink); }
  </style>
</head>
<body>

  <header class="app-header">
    <h1>Check-in Raduno</h1>
    <p>Aquile Alfee 2027</p>
  </header>

  <main class="app-container">
    
    <div id="scannerBox" class="scanner-box">
      <div id="reader"></div>
    </div>

    <div id="resultBox" class="result-box hidden"></div>

    <div id="manualBox" class="manual-box">
      <label class="manual-label">Problemi con il QR? Cerca manualmente:</label>
      <div class="manual-input-group">
        <input type="text" id="manualCode" placeholder="MGC2027-XXXXXX o Cognome" class="manual-input">
        <button onclick="manualCheckIn()" class="btn-search">Cerca</button>
      </div>
    </div>

  </main>

  <script>
    const WEB_APP_URL = 'https://script.google.com/macros/s/AKfycbwrx5s88EV-zuq1FpCWCaqGiUVoRFioebcNEqM6oSLtCuqNoY6Sv_iEBsxhWhcJZJ4B/exec';

    const qr = new Html5Qrcode('reader');
    let lastScanned = '';
    let lastScanTime = 0;
    let currentCode = '';
    let busy = false;

    qr.start(
      { facingMode: 'environment' },
      { fps: 10, qrbox: { width: 250, height: 250 } },
      onScanSuccess
    ).catch(err => {
      document.getElementById('scannerBox').innerHTML = 
        '<div style="color:var(--error); font-size:0.875rem; padding:1rem; text-align:center;">Impossibile accedere alla fotocamera.<br>Usa il campo manuale qui sotto.<br><br><em style="color:var(--ink-3); font-size:0.75rem;">' + err + '</em></div>';
    });

    async function onScanSuccess(decodedText) {
      if (busy) return;
      const now = Date.now();
      if (decodedText === lastScanned && now - lastScanTime < 3000) return;
      lastScanned = decodedText;
      lastScanTime = now;
      currentCode = decodedText;
      
      beep();
      
      try {
        busy = true;
        const response = await fetch(WEB_APP_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify({ action: 'verify', code: decodedText })
        });
        const result = await response.json();
        showResult(result);
      } catch (err) {
        showError('Errore di connessione. Riprova.');
      } finally {
        busy = false;
      }
    }

    async function manualCheckIn() {
      const query = document.getElementById('manualCode').value.trim();
      if (!query || busy) return;
      beep();
      try {
        busy = true;
        if (query.toUpperCase().startsWith('MGC2027-')) {
          currentCode = query.toUpperCase();
          const response = await fetch(WEB_APP_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'text/plain;charset=utf-8' },
            body: JSON.stringify({ action: 'verify', code: query.toUpperCase() })
          });
          const result = await response.json();
          showResult(result);
        } else {
          const response = await fetch(WEB_APP_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'text/plain;charset=utf-8' },
            body: JSON.stringify({ action: 'search', query: query })
          });
          const result = await response.json();
          showSearchResults(result);
        }
      } catch (err) {
        showError('Errore: ' + err.message);
      } finally {
        busy = false;
      }
    }

    async function verificaDaLista(code) {
      currentCode = code;
      try {
        busy = true;
        const response = await fetch(WEB_APP_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify({ action: 'verify', code: code })
        });
        const result = await response.json();
        showResult(result);
      } catch (err) {
        showError('Errore: ' + err.message);
      } finally {
        busy = false;
      }
    }

    async function confermaIngresso() {
      if (!currentCode || busy) return;
      busy = true;
      
      const btn = document.getElementById('confirmBtn');
      if (btn) {
        btn.disabled = true;
        btn.textContent = 'Registrazione in corso...';
        btn.style.opacity = '0.7';
      }
      
      try {
        const response = await fetch(WEB_APP_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify({ action: 'confirm', code: currentCode })
        });
        const result = await response.json();
        showResult(result);
      } catch (err) {
        showError('Errore: ' + err.message);
      } finally {
        busy = false;
      }
    }

    function getIcon(type) {
      const stroke = 'currentColor';
      if (type === 'ok') return `<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="${stroke}" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>`;
      if (type === 'clock') return `<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="${stroke}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>`;
      if (type === 'warning') return `<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="${stroke}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"></path><line x1="12" y1="9" x2="12" y2="13"></line><line x1="12" y1="17" x2="12.01" y2="17"></line></svg>`;
      if (type === 'error') return `<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="${stroke}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><line x1="15" y1="9" x2="9" y2="15"></line><line x1="9" y1="9" x2="15" y2="15"></line></svg>`;
      return `<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="${stroke}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>`;
    }

    function renderOrderInfo(result) {
      if (!result.dataIscrizione && !result.modalitaPagamento && !result.dataPagamento) return '';
      let html = '<div class="order-info-block">';
      html += '<p class="order-info-title">Dati iscrizione</p>';
      if (result.dataIscrizione) {
        html += `<div class="detail-row"><span class="detail-label">Iscritto il</span><span class="detail-value">${result.dataIscrizione}</span></div>`;
      }
      if (result.dataPagamento) {
        html += `<div class="detail-row"><span class="detail-label">Pagamento registrato il</span><span class="detail-value">${result.dataPagamento}</span></div>`;
      }
      if (result.modalitaPagamento) {
        html += `<div class="detail-row"><span class="detail-label">Metodo pagamento</span><span class="detail-value">${result.modalitaPagamento}</span></div>`;
      }
      html += '</div>';
      return html;
    }

    function showResult(result) {
      const box = document.getElementById('resultBox');
      const scannerBox = document.getElementById('scannerBox');
      const manualBox = document.getElementById('manualBox');
      
      scannerBox.classList.add('hidden');
      manualBox.classList.add('hidden');
      box.classList.remove('hidden');
      
      let statusClass, iconType, title;
      
      if (result.status === 'ready') {
        statusClass = 'status-ok';
        iconType = 'ok';
        title = 'QUOTA VERSATA';
      } else if (result.status === 'ok') {
        statusClass = 'status-ok';
        iconType = 'ok';
        title = 'INGRESSO REGISTRATO';
      } else if (result.status === 'not_paid') {
        statusClass = 'status-error';
        iconType = 'error';
        title = 'NON PAGATO';
      } else if (result.status === 'already_in') {
        statusClass = 'status-info';
        iconType = 'clock';
        title = 'INGRESSO REGISTRATO';
      } else {
        statusClass = 'status-neutral';
        iconType = 'error';
        title = 'NON TROVATO';
      }
      
      let html = `<div class="${statusClass}">`;
      
      html += `<div class="result-header">
        <div class="result-icon">${getIcon(iconType)}</div>
        <h2 class="result-title">${title}</h2>`;
      if (result.name) {
        html += `<p class="result-name">${result.name}</p>`;
      }
      if (result.status === 'already_in' && result.timestamp) {
        html += `<div class="info-timestamp">Ingresso del ${result.timestamp}</div>`;
      }
      if (result.status === 'ok' && result.timestamp) {
        html += `<div class="info-timestamp success">Ingresso del ${result.timestamp}</div>`;
      }
      if (result.total) {
        html += `<p class="result-total">Totale: <strong>${Number(result.total).toFixed(2).replace('.', ',')} €</strong></p>`;
      }
      html += `</div>`;
      
      if (result.status === 'ready' || result.status === 'ok' || result.status === 'already_in' || result.status === 'not_paid') {
        html += `<div class="result-details">`;
        
        html += renderOrderInfo(result);
        
        if (result.pilotDetails) {
          html += `<div class="person-block">`;
          html += `<div class="person-title">Pilota</div>`;
          
          if (result.pilotDetails.moto) {
            html += `<div class="detail-row"><span class="detail-label">Moto</span><span class="detail-value">${result.pilotDetails.moto}</span></div>`;
          }
          if (result.pilotDetails.citta) {
            html += `<div class="detail-row"><span class="detail-label">Città</span><span class="detail-value">${result.pilotDetails.citta}</span></div>`;
          }
          if (result.pilotDetails.club) {
            html += `<div class="detail-row"><span class="detail-label">Club</span><span class="detail-value">${result.pilotDetails.club}</span></div>`;
          }
          
          html += `<div style="height:0.5rem;"></div>`;
          
          if (result.pilotDetails.hasMeals) {
            html += `<ul class="meal-list">`;
            result.pilotDetails.meals.forEach(m => { html += `<li>${m.label}</li>`; });
            html += `</ul>`;
          } else {
            html += `<p style="font-size:0.875rem; color:var(--ink-3); font-style:italic; margin:0;">Nessun pasto prenotato</p>`;
          }
          if (result.pilotDetails.shirt) {
            html += `<div class="detail-row" style="margin-top:0.5rem;"><span class="detail-label">Taglia Maglietta</span><span class="detail-value">${result.pilotDetails.shirt}</span></div>`;
          }
          if (result.pilotDetails.intolleranze) {
            html += `<div class="dietary-box"><strong>Intolleranze / Esigenze</strong>${result.pilotDetails.intolleranze}</div>`;
          }
          html += `</div>`;
        }
        
        if (result.passengerDetails && result.passengerName) {
          html += `<div class="person-block">`;
          html += `<div class="person-title">Passeggero</div>`;
          html += `<p style="font-size:1.125rem; font-weight:700; color:var(--ink); margin:0 0 0.75rem 0;">${result.passengerName}</p>`;
          if (result.passengerDetails.hasMeals) {
            html += `<ul class="meal-list">`;
            result.passengerDetails.meals.forEach(m => { html += `<li>${m.label}</li>`; });
            html += `</ul>`;
          } else {
            html += `<p style="font-size:0.875rem; color:var(--ink-3); font-style:italic; margin:0;">Nessun pasto prenotato</p>`;
          }
          if (result.passengerDetails.shirt) {
            html += `<div class="detail-row" style="margin-top:0.5rem;"><span class="detail-label">Taglia Maglietta</span><span class="detail-value">${result.passengerDetails.shirt}</span></div>`;
          }
          if (result.passengerDetails.intolleranze) {
            html += `<div class="dietary-box"><strong>Intolleranze / Esigenze</strong>${result.passengerDetails.intolleranze}</div>`;
          }
          html += `</div>`;
        }
        
        html += `</div>`;
      }
      
      html += `<div class="result-actions">`;
      
      if (result.status === 'ready') {
        html += `<button id="confirmBtn" onclick="confermaIngresso()" class="btn-action btn-confirm">Conferma Ingresso</button>`;
        html += `<button onclick="resetScanner()" class="btn-action btn-cancel">Annulla</button>`;
      } else {
        html += `<button onclick="resetScanner()" class="btn-action btn-next">Scansiona Prossimo</button>`;
      }
      
      html += `</div>`;
      html += `</div>`;
      
      box.innerHTML = html;
      
      if (navigator.vibrate) {
        if (result.status === 'ok') navigator.vibrate([100, 50, 100]);
        else if (result.status === 'ready') navigator.vibrate([50]);
        else navigator.vibrate([300]);
      }
      
      if (result.status === 'ok') {
        setTimeout(() => {
          if (!document.getElementById('resultBox').classList.contains('hidden')) {
            resetScanner();
          }
        }, 3000);
      }
    }

    function showSearchResults(result) {
      const box = document.getElementById('resultBox');
      const scannerBox = document.getElementById('scannerBox');
      const manualBox = document.getElementById('manualBox');
      
      scannerBox.classList.add('hidden');
      manualBox.classList.add('hidden');
      box.classList.remove('hidden');
      
      if (result.status === 'not_found') {
        box.innerHTML = `
          <div class="status-neutral">
            <div class="result-header">
              ${getIcon('error')}
              <h2 class="result-title">NON TROVATO</h2>
            </div>
            <div class="result-details" style="text-align:center;">
              <p style="color:var(--ink-2);">${result.message}</p>
            </div>
            <div class="result-actions">
              <button onclick="resetScanner()" class="btn-action btn-next">Riprova</button>
            </div>
          </div>
        `;
        return;
      }
      
      if (result.status === 'list') {
        let html = `<div style="padding: 1.5rem;">`;
        html += `<h2 class="search-results-title">Trovati ${result.results.length} iscritti</h2>`;
        
        result.results.forEach(r => {
          const statoClass = r.paid ? 'paid' : 'not-paid';
          const statoText = r.paid ? (r.alreadyIn ? 'Presente' : 'Pagato') : 'Non pagato';
          
          html += `
            <button onclick="verificaDaLista('${r.code}')" class="search-item">
              <div>
                <p class="search-item-name">${r.name}</p>
                <p class="search-item-status ${statoClass}">${statoText}</p>
              </div>
              <div style="text-align:right;">
                <p style="font-size:0.65rem; text-transform:uppercase; color:var(--ink-3); margin:0;">Totale</p>
                <p class="search-item-price">${Number(r.total).toFixed(2).replace('.', ',')} €</p>
              </div>
            </button>
          `;
        });
        
        html += `<button onclick="resetScanner()" class="btn-action btn-cancel" style="margin-top:1rem;">Annulla</button>`;
        html += `</div>`;
        box.innerHTML = html;
      }
    }

    function showError(msg) {
      const box = document.getElementById('resultBox');
      const scannerBox = document.getElementById('scannerBox');
      const manualBox = document.getElementById('manualBox');
      
      scannerBox.classList.add('hidden');
      manualBox.classList.add('hidden');
      box.classList.remove('hidden');
      
      box.innerHTML = `
        <div class="status-error">
          <div class="result-header">
            ${getIcon('error')}
            <h2 class="result-title">ERRORE</h2>
          </div>
          <div class="result-details" style="text-align:center;">
            <p style="color:var(--ink-2);">${msg}</p>
          </div>
          <div class="result-actions">
            <button onclick="resetScanner()" class="btn-action btn-next">Riprova</button>
          </div>
        </div>
      `;
    }

    function resetScanner() {
      document.getElementById('resultBox').classList.add('hidden');
      document.getElementById('scannerBox').classList.remove('hidden');
      document.getElementById('manualBox').classList.remove('hidden');
      document.getElementById('manualCode').value = '';
      lastScanned = '';
      lastScanTime = 0;
      currentCode = '';
      busy = false;
    }

    function beep() {
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator();
        osc.connect(ctx.destination);
        osc.frequency.value = 1200;
        osc.start();
        setTimeout(() => osc.stop(), 100);
      } catch (e) {}
    }
  </script>
</body>
</html>
